<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>האטלס של אבא</title>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#ecebf8;--card:#f8f7ff;--ink:#1e1b4b;--mut:#5b5a86;--acc:#0e7c86;--gold:#7c4dcc;--line:#cfcbea;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12102b;--card:#1d1a42;--ink:#ecebfa;--mut:#a9a6d6;--acc:#4fd1c5;--gold:#b69cff;--line:#342f6b;--on:#12102b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12102b;--card:#1d1a42;--ink:#ecebfa;--mut:#a9a6d6;--acc:#4fd1c5;--gold:#b69cff;--line:#342f6b;--on:#12102b;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:19px/1.65 "Frank Ruhl Libre","Times New Roman",serif;padding-bottom:92px;-webkit-text-size-adjust:100%}
main{max-width:640px;margin:0 auto;padding:20px 18px}
h1,h2,h3{font-family:"Frank Ruhl Libre","Times New Roman",serif;line-height:1.2;margin:0;font-weight:900}
h1{font-size:2.6rem}
h2{font-size:1.7rem;margin-bottom:12px}
h3{font-size:1.3rem}
p{margin:0 0 12px}
.mut{color:var(--mut)}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hero{padding:18px 0 22px;border-bottom:2px solid var(--ink);margin-bottom:22px}
.hero p{margin:8px 0 0;font-size:1.1rem}
.fact{border:2px dashed var(--acc);border-radius:6px;padding:16px 18px;background:var(--card);margin-bottom:20px}
.fact b{color:var(--acc);font-size:1.2rem;display:block;margin-bottom:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.tap{width:100%;text-align:start;display:block}
.btn{background:var(--acc);color:var(--on);border:0;border-radius:8px;padding:12px 18px;font-weight:700;min-height:48px}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.warn{background:transparent;color:var(--mut);border:1px solid var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:8px 16px;white-space:nowrap;min-height:44px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input,select,textarea{width:100%;font:inherit;padding:12px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);margin:4px 0 14px}
label{font-weight:700;font-size:1rem}
.tag{display:inline-block;font-size:.9rem;color:var(--acc);border:1px solid var(--acc);border-radius:99px;padding:0 10px;margin-inline-end:8px}
.story{border-inline-start:4px solid var(--gold);padding-inline-start:14px;margin:14px 0}
.ing{list-style:none;padding:0;margin:0 0 20px}
.ing li{padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.ing li.done{text-decoration:line-through;color:var(--mut)}
.steps{padding-inline-start:26px;margin:0 0 20px}
.steps li{margin-bottom:14px}
.cook{font-size:1.45rem;line-height:1.6}
.cook h2{font-size:2.1rem}
.soon{text-align:center;padding:40px 18px}
.soon .big{font-size:3rem}
.rimg{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:12px;display:block}
.timg{width:76px;height:76px;object-fit:cover;border-radius:10px;flex:none;display:block}
.ph{display:grid;place-items:center;background:linear-gradient(135deg,var(--acc),var(--gold));font-size:2.4rem;color:var(--on)}
.rimg.ph{font-size:4rem}
label.btn{display:inline-flex;align-items:center;cursor:pointer}
.bar{display:block;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--gold))}
.hrow{display:flex;gap:6px}
.hd{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:6px 0;display:flex;flex-direction:column;align-items:center;min-height:56px}
.hd.on{background:var(--acc);color:var(--on);border-color:var(--acc)}
.hd small{font-size:.75rem}
.hd b{font-size:1.1rem}
.gcs{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:12px 0 18px}
.gc{aspect-ratio:1;border-radius:6px;border:1px solid var(--line);background:var(--card)}
.gc.on{background:var(--acc);border-color:var(--acc)}
.gc.fut{opacity:.35}
.gh{text-align:center;font-size:.85rem;color:var(--mut)}
.orbwrap{position:relative;height:300px;display:grid;place-items:center;margin:10px 0}
.orb{width:180px;height:180px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--gold));opacity:.9;transform:scale(1)}
.orbtxt{position:absolute;inset:0;display:grid;place-content:center;text-align:center;color:var(--on);font-weight:900;font-size:1.6rem;line-height:1.2;pointer-events:none}
.orbtxt #bs{font-size:2.6rem}
@media (prefers-reduced-motion:reduce){.orb{transition:none!important}}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;padding:6px 0;font-size:.8rem;color:var(--mut);min-height:52px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:1.4rem;line-height:1}
nav button[aria-current="page"]{color:var(--acc);font-weight:700}
</style>

  var p = ks[0].split("-"), ws = new Date(+p[0], +p[1] - 1, +p[2]); ws = addDays(ws, -ws.getDay());

  while (ws <= end) { if (weekCount(h.id, ws) >= g) { run++; if (run > best) best = run; } else run = 0; ws = addDays(ws, 7); }
  return best;
}
function curStreak(h){ return goalOf(h) === 7 ? streak(h.id) : wStreak(h); }
function bestS(h){ return goalOf(h) === 7 ? bestStreak(h.id) : wBest(h); }
function unit(h, n){ if (goalOf(h) === 7) return n === 1 ? "יום אחד" : n + " ימים"; return n === 1 ? "שבוע אחד" : n === 2 ? "שבועיים" : n + " שבועות"; }
function hSub(s){ hs.sub = s; hs.open = null; hs.add = false; render(); }
function hOpen(id){ hs.open = id; render(); window.scrollTo(0,0); }
function hBack(){ hs.open = null; render(); }
function hGo(){ hs.sub = "habits"; hs.open = null; hs.add = false; go("breathe"); }
function habitBanner(){
  var n = new Date(), hm = pad(n.getHours()) + ":" + pad(n.getMinutes()), tk = dk(n);
  var due = HB.habits.filter(function(h){ return h.time && h.time <= hm && !isDone(h.id, tk); });
  if (!due.length) return "";
  return '<button class="card tap" style="border:2px solid var(--gold)" onclick="hGo()"><b>⏰ תזכורת להיום</b><br>עוד לא סימנת: ' + due.map(function(h){ return h.emoji + " " + esc(h.name); }).join(", ") + '</button>';
}
function healthView(){
  if (br.ex) return breathe();
  var seg = '<div class="chips">' + [["breathe","נשימה"],["habits","מעקב הרגלים"]].map(function(x){ return '<button class="chip" aria-pressed="' + (hs.sub === x[0]) + '" onclick="hSub(\'' + x[0] + '\')">' + x[1] + '</button>'; }).join("") + '</div>';
  return seg + (hs.sub === "habits" ? habits() : breathe());
}
function habits(){
  if (hs.add) return hForm();
  var h = hs.open && HB.habits.filter(function(x){ return x.id === hs.open; })[0];
  if (h) return hDetail(h);
  var today = new Date().toLocaleDateString("he-IL", {weekday:"long", day:"numeric", month:"long"});
  return '<div class="row"><h2 style="margin:0">הרגלים</h2><button class="btn" onclick="hs.add=true;render()">הרגל חדש</button></div><p class="mut">' + today + '</p>' + habitBanner() +
    (HB.habits.length ? HB.habits.map(hCard).join("") : '<p class="mut">עוד אין הרגלים. הוסיפו את הראשון.</p>');
}
function hCard(h){
  var t = new Date(), tk = dk(t), cells = "", wk = 0;
  for (var i = 6; i >= 0; i--) {
    var d = addDays(t, -i), k = dk(d), on = isDone(h.id, k); if (on) wk++;
    cells += '<button class="hd' + (on ? ' on' : '') + '" aria-pressed="' + on + '" aria-label="' + DAYS[d.getDay()] + ' ' + d.getDate() + '" onclick="hToggle(\'' + h.id + '\',\'' + k + '\')"><small>' + DAYS[d.getDay()] + '</small><b>' + (on ? '✓' : d.getDate()) + '</b></button>';
  }
  var done = isDone(h.id, tk), s = curStreak(h), sx = unit(h, s), g = goalOf(h), wc = weekCount(h.id, addDays(t, -t.getDay())), pct = Math.min(100, Math.round(wc / g * 100));
  return '<div class="card"><button class="tap" style="background:none;border:0;padding:0;margin-bottom:10px" onclick="hOpen(\'' + h.id + '\')"><h3>' + h.emoji + ' ' + esc(h.name) + '</h3><span class="mut">' + 'יעד: ' + goalTxt(h) + (h.time ? ' · ⏰ ' + h.time : '') + '</span><br><span class="mut">' + (s ? '🔥 רצף: ' + sx + ' · ' : '') + 'השבוע: ' + wc + ' מתוך ' + g + (wc >= g ? ' ✓' : '') + '</span><span class="bar" style="margin-top:8px"><i style="width:' + pct + '%"></i></span></button><div class="hrow">' + cells + '</div>' +
    '<div style="margin-top:12px"><button class="btn' + (done ? ' alt' : '') + '" onclick="hToggle(\'' + h.id + '\',\'' + tk + '\')">' + (done ? '✓ בוצע היום (לחיצה לביטול)' : 'סימנתי להיום') + '</button></div></div>';
}
function hDetail(h){
  var t = new Date(), tk = dk(t), start = addDays(t, -t.getDay() - 28), grid = "", l30 = 0, total = Object.keys(HB.log[h.id] || {}).length;
  var heads = DAYS.map(function(x){ return '<div class="gh">' + x + '</div>'; }).join("");
  for (var i = 0; i < 35; i++) { var d = addDays(start, i), k = dk(d); grid += '<div class="gc' + (isDone(h.id, k) ? ' on' : '') + (k > tk ? ' fut' : '') + '" title="' + k + '"></div>'; }
  for (var j = 0; j < 30; j++) { if (isDone(h.id, dk(addDays(t, -j)))) l30++; }
  return '<button class="btn alt" onclick="hBack()">חזרה להרגלים</button><h2 style="margin-top:18px">' + h.emoji + ' ' + esc(h.name) + '</h2>' +
    '<div class="card"><p style="margin:0"><b>יעד:</b> ' + goalTxt(h) + '<br><b>רצף נוכחי:</b> ' + unit(h, curStreak(h)) + '<br><b>הרצף הארוך ביותר:</b> ' + unit(h, bestS(h)) + '<br><b>סך הכול ימים שבוצעו:</b> ' + total + '<br><b>ב-30 הימים האחרונים:</b> ' + l30 + ' מתוך 30 (' + Math.round(l30 / 30 * 100) + '%)</p></div>' +
    '<h3 style="margin-bottom:6px">5 השבועות האחרונים</h3><div class="gcs">' + heads + grid + '</div>' +
    '<div class="card"><label for="h-goal">יעד</label><select id="h-goal">' + goalOpts(goalOf(h)) + '</select><label for="h-time">שעת תזכורת</label><input id="h-time" type="time" value="' + (h.time || "") + '"><div class="row" style="flex-wrap:wrap"><button class="btn" onclick="hSaveTime(\'' + h.id + '\')">שמירה</button><button class="btn alt" onclick="hIcs(\'' + h.id + '\')">הוספה ליומן של הטלפון</button></div>' +
    '<p class="mut" style="font-size:.95rem;margin:12px 0 0">התזכורת באפליקציה מופיעה כשפותחים אותה אחרי השעה שנבחרה. כדי לקבל התראה גם כשהאפליקציה סגורה, צריך להוסיף אותה ליומן.</p></div>' +
    '<button class="btn warn" onclick="hDel(\'' + h.id + '\')">מחיקת ההרגל</button>';
}
function hSaveTime(id){ var v = document.getElementById("h-time").value, g = +document.getElementById("h-goal").value; HB.habits.forEach(function(h){ if (h.id === id) { h.time = v; h.goal = g; } }); hsave(); alert("נשמר."); render(); }
function hDel(id){ if (!confirm("למחוק את ההרגל ואת כל ההיסטוריה שלו?")) return; HB.habits = HB.habits.filter(function(h){ return h.id !== id; }); delete HB.log[id]; hsave(); hs.open = null; render(); }
function hForm(){
  return '<button class="btn alt" onclick="hs.add=false;render()">ביטול</button><h2 style="margin-top:18px">הרגל חדש</h2><label for="hn">שם ההרגל</label><input id="hn" placeholder="למשל: הליכה של חצי שעה"><label for="he">סמל</label><select id="he">' +
    ["🏃","🥗","💧","🚶","🧘","😴","📖","💊","🎯"].map(function(e){ return '<option>' + e + '</option>'; }).join("") + '</select><label for="hg">יעד</label><select id="hg">' + goalOpts(7) + '</select><label for="ht">שעת תזכורת (לא חובה)</label><input id="ht" type="time"><button class="btn" onclick="hSaveNew()">שמירה</button>';
}
function hSaveNew(){
  var n = document.getElementById("hn").value.trim(); if (!n) { alert("נא לתת להרגל שם."); return; }
  HB.habits.push({id:"h" + Date.now(), name:n, emoji:document.getElementById("he").value, time:document.getElementById("ht").value, goal:+document.getElementById("hg").value}); hsave(); hs.add = false; render();
}
function hIcs(id){
  var h = HB.habits.filter(function(x){ return x.id === id; })[0];
  if (!h || !h.time) { alert("קודם בחרו שעה לתזכורת ולחצו על שמירת השעה."); return; }
  var p = h.time.split(":"), s = dk(new Date()).split("-").join("") + "T" + p[0] + p[1] + "00";
  var stamp = new Date().toISOString().split("-").join("").split(":").join("").split(".")[0] + "Z";
  var nm = h.name.split(",").join(" ").split(";").join(" ");
  var ics = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//DadsAtlas//HE","BEGIN:VEVENT","UID:" + h.id + "-" + Date.now() + "@dadsatlas","DTSTAMP:" + stamp,"DTSTART:" + s,"RRULE:FREQ=DAILY","SUMMARY:" + h.emoji + " " + nm,"BEGIN:VALARM","TRIGGER:PT0M","ACTION:DISPLAY","DESCRIPTION:" + nm,"END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
  try { var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([ics], {type:"text/calendar"})); a.download = "reminder.ics"; document.body.appendChild(a); a.click(); a.remove(); } catch (e) { alert("לא הצלחתי ליצור את הקובץ."); }
}
function soon(t){
  var m = {games:["🧩","משחקים","טריוויה, תשבצים וחידות הם החלק הבא שייבנה."],explore:["🧭","מסעות","מפת עולם לסימון מקומות שביקרת בהם, וגלריית אמנות."],family:["💌","משפחה","תמונות, זיכרונות וברכות יום הולדת יגיעו לכאן."]}[t];
  return '<div class="soon card"><div class="big">' + m[0] + '</div><h2>' + m[1] + '</h2><p class="mut">' + m[2] + '</p></div>';
}
function render(){
  document.getElementById("view").innerHTML = st.tab === "home" ? home() : st.tab === "kitchen" ? kitchen() : st.tab === "breathe" ? healthView() : soon(st.tab);
  document.getElementById("nav").innerHTML = TABS.map(function(t){
    return '<button onclick="go(\'' + t[0] + '\')"' + (st.tab === t[0] ? ' aria-current="page"' : '') + '><span>' + t[1] + '</span>' + t[2] + '</button>';
  }).join("");
  if (st.tab === "kitchen" && !st.open && !st.adding) fillList();
}
function fromHash(){ var h = (location.hash || "").slice(1); if (TABS.some(function(t){ return t[0] === h; })) { st.tab = h; st.open = null; st.adding = false; } }
window.addEventListener("hashchange", function(){ fromHash(); render(); });
try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
render(); loadShared();
</script>
